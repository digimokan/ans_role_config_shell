# paths to shell files invoked on login
cfg_shell_bash_login_file_path: "/home/{{ cfg_shell_user_name }}/.bash_profile"
cfg_shell_sh_ksh_login_file_path: "/home/{{ cfg_shell_user_name }}/.profile"
cfg_shell_csh_tcsh_login_file_path: "/home/{{ cfg_shell_user_name }}/.login"
cfg_shell_zsh_login_file_path: "/home/{{ cfg_shell_user_name }}/.zprofile"

# paths to shell files invoked on logout
cfg_shell_bash_logout_file_path: "/home/{{ cfg_shell_user_name }}/.bash_logout"
cfg_shell_sh_ksh_csh_tcsh_logout_file_path: "/home/{{ cfg_shell_user_name }}/.logout"
cfg_shell_zsh_logout_file_path: "/home/{{ cfg_shell_user_name }}/.zlogout"

# paths to shell files invoked for special conditions
cfg_shell_zsh_env_file_path: "/home/{{ cfg_shell_user_name }}/.zshenv"

