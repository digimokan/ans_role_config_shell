- name: "Configure zsh environment-vars config file '{{ cfg_shell_zsh_env_file_path }}'"
  ansible.builtin.template:
    dest: "{{ cfg_shell_zsh_env_file_path }}"
    src: "zshenv.j2"
    owner: "{{ cfg_shell_user_name }}"
    mode: '644'
    force: true
    validate: "sh -n %s"
  become: true
  become_user: root

