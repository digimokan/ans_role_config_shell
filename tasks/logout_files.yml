- name: "Configure bash logout config file '{{ cfg_shell_bash_logout_file_path }}'"
  ansible.builtin.template:
    dest: "{{ cfg_shell_bash_logout_file_path }}"
    src: "bash_logout.j2"
    owner: "{{ cfg_shell_user_name }}"
    mode: '644'
    force: true
    validate: "sh -n %s"
  become: true
  become_user: root

- name: "Configure bourne, ksh, csh, and tcsh logout config file '{{ cfg_shell_sh_ksh_csh_tcsh_logout_file_path }}'"
  ansible.builtin.template:
    dest: "{{ cfg_shell_sh_ksh_csh_tcsh_logout_file_path }}"
    src: "logout.j2"
    owner: "{{ cfg_shell_user_name }}"
    mode: '644'
    force: true
    validate: "sh -n %s"
  become: true
  become_user: root

- name: "Configure zsh logout config file '{{ cfg_shell_zsh_logout_file_path }}'"
  ansible.builtin.template:
    dest: "{{ cfg_shell_zsh_logout_file_path }}"
    src: "zlogout.j2"
    owner: "{{ cfg_shell_user_name }}"
    mode: '644'
